name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels the previous run on the same branch: there is no point in
# finishing a check that is already out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # ci rather than install: it installs exactly what package-lock says
      - run: npm ci

      - name: Style
        run: npm run lint

      - name: Core tests
        run: npm test

      # Secrets stay in the git history forever, so we check on every push
      # rather than by eye during review.
      - name: No credentials in the code
        run: |
          if grep -rnE "password\s*[:=]\s*['\"][^'\"]{6,}" \
               --include='*.js' --include='*.cjs' --include='*.json' \
               --exclude-dir=node_modules . ; then
            echo "::error::This looks like a hardcoded password"
            exit 1
          fi
          echo "No hardcoded passwords found"
