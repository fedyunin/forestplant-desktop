name: Installers

# Triggered by a tag such as v0.1.0. Building on every push makes no sense:
# macOS minutes cost ten times the ordinary ones, and installers are needed
# when a release actually happens.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the files to a Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false   # a failure on one platform does not cancel the other
      matrix:
        include:
          - os: macos-latest
            label: macOS
            build: npm run dist:mac
            artifacts: dist/*.dmg
          # Windows is built on real Windows: the native database module is
          # rebuilt there for its own platform rather than substituted.
          - os: windows-latest
            label: Windows
            build: npm run dist:win
            artifacts: dist/*.exe
          # Linux is an AppImage: one file, no package manager, runs after a
          # chmod +x. The native module is rebuilt on the runner like the rest.
          - os: ubuntu-latest
            label: Linux
            build: npm run dist:linux
            artifacts: dist/*.AppImage

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: ${{ matrix.build }}
        env:
          # There is no signing: without this electron-builder looks for a
          # certificate and fails.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # The changelog is the source of the release notes, so the code has to
      # be here too, not just the built files.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      # The release publishes itself, so there is no moment afterwards in
      # which to write its notes by hand. They are the changelog section for
      # this version, with the relative links made absolute — «LICENSE» means
      # nothing outside the repository — and the generated commit list is
      # appended underneath by the action.
      - name: Take the notes out of the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | perl -pe 's{\]\((?!https?://|#)([^)]+)\)}{](https://github.com/$ENV{GITHUB_REPOSITORY}/blob/$ENV{GITHUB_REF_NAME}/$1)}g' \
            > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No changelog section for $version — the release goes out with generated notes only"
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: files/*
          body_path: notes.md
          generate_release_notes: true
          # Published outright rather than left as a draft: releases here are
          # cut from a tag deliberately, and the notes are already written.
          draft: false
          make_latest: true
