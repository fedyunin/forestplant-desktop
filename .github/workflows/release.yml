name: Installers

# Triggered by a tag such as v0.1.0. Building on every push makes no sense:
# macOS minutes cost ten times the ordinary ones, and installers are needed
# when a release actually happens.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the files to a Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false   # a failure on one platform does not cancel the other
      matrix:
        include:
          - os: macos-latest
            label: macOS
            build: npm run dist:mac
            artifacts: dist/*.dmg
          # Windows is built on real Windows: the native database module is
          # rebuilt there for its own platform rather than substituted.
          - os: windows-latest
            label: Windows
            build: npm run dist:win
            artifacts: dist/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: ${{ matrix.build }}
        env:
          # There is no signing: without this electron-builder looks for a
          # certificate and fails.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          draft: true      # a draft: to look at before publishing
          generate_release_notes: true
