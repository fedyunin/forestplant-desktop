<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
<title>Forest Fund</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="brand" data-i18n="app.title">Forest Fund</div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="data" data-i18n="tab.data">Data</button>
    <button class="tab" data-tab="export" data-i18n="tab.export">Export</button>
    <button class="tab" data-tab="settings" data-i18n="tab.settings">Settings</button>
  </nav>
  <div class="dbinfo" id="dbinfo" data-i18n="db.notOpen">no database open</div>
</header>

<main>

<!-- ================================================ DATA -->
<section class="page active" id="page-data">
  <div class="split">
    <aside class="side">
      <div class="side-h">
        <input type="search" id="dSearch" data-i18n-ph="search.forestry">
      </div>
      <div class="side-list" id="dList"></div>
      <div class="side-f">
        <button class="link" id="dClear" data-i18n="list.clearPick">clear selection</button>
        <span id="dPicked" data-i18n="list.all">all</span>
      </div>
    </aside>

    <div class="main-col">
      <div class="bar">
        <div class="modes" id="dModes">
          <button class="mode on" data-mode="filters" data-i18n="mode.filters">Filters</button>
          <button class="mode" data-mode="sql" data-i18n="mode.sql">SQL</button>
        </div>
        <span class="grow"></span>
        <span class="count" id="dCount"></span>
      </div>

      <div id="dModeFilters">
        <div class="bar">
          <label class="inline"><span data-i18n="filter.kvartal">Block</span>
            <input id="dKvartal" placeholder="1,5-9"></label>
          <label class="inline"><span data-i18n="filter.vydel">Stand</span>
            <input id="dVydel" placeholder="2,3"></label>
          <label class="inline"><span data-i18n="filter.areaFrom">Area from</span>
            <input id="dPloshadMin" type="number" step="0.1"></label>
          <label class="inline"><span data-i18n="filter.areaTo">to</span>
            <input id="dPloshadMax" type="number" step="0.1"></label>
          <button class="ghost small" id="dMoreFilters" data-i18n="filter.more">more filters</button>
        </div>
        <div class="facets" id="dFacets" hidden></div>
      </div>

      <div id="dModeSql" hidden>
        <div class="sqlbox">
          <textarea id="dSqlText" rows="4" spellcheck="false"></textarea>
          <div class="bar">
            <button class="primary" id="dSqlRun" data-i18n="sql.apply">Apply</button>
            <button class="ghost small" id="dSqlFromFilters" data-i18n="sql.fromFilters">take from filters</button>
            <select id="dSqlTables"></select>
            <span class="grow"></span>
            <span class="hint" id="dSqlInfo"></span>
          </div>
          <p class="hint" data-i18n="sql.hint"></p>
        </div>
      </div>

      <div class="table-wrap">
        <table class="grid" id="dTable">
          <thead id="dHead"></thead>
          <tbody id="dBody"></tbody>
        </table>
        <div class="empty" id="dEmpty" hidden data-i18n="data.empty">nothing found</div>
      </div>

      <div class="pager">
        <button class="ghost small" id="dPrev">←</button>
        <span id="dRange">—</span>
        <button class="ghost small" id="dNext">→</button>
        <span class="grow"></span>
        <button class="ghost small" id="dToExport" data-i18n="data.toExport">Export this selection</button>
      </div>
    </div>

    <aside class="detail" id="dDetail" hidden>
      <div class="detail-h">
        <span id="dDetailTitle"></span>
        <button class="link" id="dDetailClose" data-i18n="detail.close">close</button>
      </div>
      <div class="detail-body" id="dDetailBody"></div>
    </aside>
  </div>
</section>

<!-- ================================================ EXPORT -->
<section class="page" id="page-export">
  <div class="split">
    <aside class="side">
      <div class="side-h">
        <input type="search" id="eSearch" data-i18n-ph="search.findForestry">
      </div>
      <div class="side-list" id="eList"></div>
      <div class="side-f">
        <button class="link" id="eAddFound" data-i18n="list.addFound">add all found</button>
        <button class="link" id="eClear" data-i18n="list.clear">clear</button>
      </div>
    </aside>

    <div class="main-col">
      <div class="picked" id="ePicked"></div>

      <div class="bar">
        <label class="inline"><span data-i18n="export.format">Format</span>
          <select id="eFormat"></select></label>
        <span class="hint" id="eHint"></span>
      </div>

      <div class="opts" id="eOpts"></div>

      <div class="bar">
        <label class="inline"><span data-i18n="filter.kvartal">Block</span>
          <input id="eKvartal" placeholder="1,5-9"></label>
        <label class="inline"><span data-i18n="filter.vydel">Stand</span>
          <input id="eVydel" placeholder="2,3"></label>
        <label class="inline"><span data-i18n="filter.areaFrom">Area from</span>
          <input id="ePloshadMin" type="number" step="0.1"></label>
        <label class="inline"><span data-i18n="filter.areaTo">to</span>
          <input id="ePloshadMax" type="number" step="0.1"></label>
      </div>

      <canvas id="ePreview" width="560" height="130"></canvas>
    </div>
  </div>

  <footer class="actions">
    <div class="preview-line" id="eLine" data-i18n="export.pickLeft"></div>
    <button class="primary" id="eRun" disabled data-i18n="export.run">Export</button>
  </footer>
</section>

<!-- ================================================ SETTINGS -->
<section class="page" id="page-settings">
  <div class="pad narrow">

    <h3 data-i18n="settings.language">Language</h3>
    <p class="hint" data-i18n="settings.languageHint"></p>
    <div class="path-row">
      <select id="sLang" class="narrow-select">
        <option value="system" data-i18n="settings.langSystem"></option>
        <option value="ru" data-i18n="settings.langRu"></option>
        <option value="en" data-i18n="settings.langEn"></option>
      </select>
      <span class="grow"></span>
      <span class="hint" id="sLangSystem"></span>
    </div>

    <h3 data-i18n="settings.dataDir">Data folder</h3>
    <p class="hint" data-i18n="settings.dataDirHint"></p>
    <div class="path-row">
      <code id="sDataDir" data-i18n="settings.notChosen">not selected</code>
      <button class="ghost small" id="sPickDir" data-i18n="settings.choose">Choose…</button>
      <button class="ghost small" id="sReveal" data-i18n="settings.reveal">Reveal</button>
    </div>
    <div class="stats" id="sStore"></div>

    <h3 data-i18n="settings.creds">GIS credentials</h3>
    <p class="hint" data-i18n="settings.credsHint"></p>
    <div class="path-row">
      <span id="sCreds" data-i18n="settings.credsNone">not set</span>
      <button class="ghost small" id="sCredsSet" data-i18n="settings.credsSet">Set…</button>
      <button class="ghost small" id="sCredsClear" data-i18n="settings.credsForget">Forget</button>
    </div>

    <h3 data-i18n="settings.dbSection">Database management</h3>
    <div class="bar">
      <button class="ghost" id="sCheck" data-i18n="settings.check">Check for updates</button>
      <button class="ghost" id="sPull" disabled data-i18n="settings.pull">Fetch changes</button>
      <button class="ghost" id="sRetry" data-i18n="settings.retry">Retry failed</button>
      <button class="ghost" id="sRebuild" data-i18n="settings.rebuild">Rebuild from archive</button>
    </div>
    <p class="hint" data-i18n="settings.dbHint"></p>

    <div class="progress" id="sProgress" hidden>
      <div class="bar-line"><div class="fill" id="sFill"></div></div>
      <div class="plog" id="sLog"></div>
    </div>
    <div id="sResult"></div>

    <h3 data-i18n="settings.archiveState">Archive state</h3>
    <div id="sBad"></div>

    <h3 data-i18n="settings.schemas">Field schemas</h3>
    <p class="hint" data-i18n="settings.schemasHint"></p>
    <div id="sSchemas"></div>
  </div>
</section>

</main>

<!-- Credentials: a form of our own, since prompt() does not work in Electron -->
<div class="modal" id="credsModal" hidden>
  <form class="modal-box" id="credsForm">
    <h3 data-i18n="settings.creds">GIS credentials</h3>
    <label><span data-i18n="settings.login">Login</span>
      <input id="credsUser" autocomplete="username" required></label>
    <label><span data-i18n="settings.password">Password</span>
      <input id="credsPass" type="password" autocomplete="current-password" required></label>
    <div class="modal-actions">
      <button type="button" class="ghost" id="credsCancel" data-i18n="settings.cancel">Cancel</button>
      <button type="submit" class="primary" data-i18n="settings.save">Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
