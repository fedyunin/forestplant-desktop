appId: kz.gharysh.forestplant
productName: ForestPlant
copyright: ""

directories:
  output: dist
  buildResources: build

# Only what the application needs goes into the build: the raw archive and the
# database stay outside — the user sets their path in the settings.
files:
  - src/**/*
  - package.json
  - "!**/*.map"

# better-sqlite3 is a native module, it has to be rebuilt for Electron
npmRebuild: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

mac:
  # The bundle name must be ASCII: with Cyrillic the built application fails
  # Electron initialisation and dies at startup. The display name is set
  # separately, through CFBundleDisplayName.
  extendInfo:
    CFBundleDisplayName: Forest Fund
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
  # There is no real certificate, but on Apple Silicon a binary has to be
  # signed at least formally, or the system kills it at startup.
  identity: "-"
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Forest Fund

linux:
  target: [AppImage]
  category: Utility
